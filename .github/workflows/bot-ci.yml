name: Trading Bot Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcurl4-openssl-dev libomp-dev

      - name: Verify or Download cJSON Dependency
        run: |
          if [ ! -f "include/cJSON.h" ]; then
            curl -s https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h -o include/cJSON.h
          fi
          if [ ! -f "src/cJSON.c" ]; then
            curl -s https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c -o src/cJSON.c
          fi

      - name: Compile Application
        run: |
          gcc -Wall -O3 -fopenmp -I./include src/main.c src/twelvedata.c src/strategy.c src/risk.c src/cJSON.c -o twelvedata_bot -lcurl -lm

      - name: Execute Backtest
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          mkdir -p reports
          ./twelvedata_bot --backtest

      - name: Archive Backtest CSV Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-report
          path: reports/*.csv
          retention-days: 14